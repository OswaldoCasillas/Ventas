name: Inventory Bot

on:
  workflow_dispatch: {}
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas
        env:
          TZ: America/Mexico_City

      - name: Prepare output folders
        run: |
          mkdir -p docs/diario
          mkdir -p docs/mercado/diario
        env:
          TZ: America/Mexico_City

      - name: Run processor
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: America/Mexico_City
        run: python scripts/process_issue.py

      - name: Sync menu from inventory
        run: python scripts/sync_menu_from_inventory.py
        env:
          TZ: America/Mexico_City

      - name: Build reports
        run: python scripts/build_reports.py
        env:
          TZ: America/Mexico_City

      - name: Commit & push
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          TZ: America/Mexico_City
        run: |
          set -e
          git config user.name "inventory-bot"
          git config user.email "actions@users.noreply.github.com"

          branch="${BRANCH_NAME:-$(git rev-parse --abbrev-ref HEAD)}"
          git fetch origin "$branch" --prune

          git add scripts/sync_menu_from_inventory.py
          git add docs/menu.json data/inventory.csv data/inventory_mercado.csv data/sales.csv data/sales_mercado.csv docs/diario docs/mercado/diario docs/ventas_detalle.csv docs/mercado/ventas_detalle.csv docs/ventas_por_dia.csv docs/ventas_por_item.csv docs/produccion_detalle.csv 2>/dev/null || true
          git add -A

          if git diff --cached --quiet; then
            echo "Sin cambios para commitear."
            exit 0
          fi

          git commit -m "chore(inventory): actualizar inventario, menu y reportes"
          git push origin HEAD:"$branch"
