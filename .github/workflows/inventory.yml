name: Inventory Bot

on:
  workflow_dispatch: {}
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests
        env:
          TZ: America/Mexico_City

      - name: Prepare output folders
        run: |
          mkdir -p docs/diario
          mkdir -p docs/mercado/diario
        env:
          TZ: America/Mexico_City

      - name: Run processor
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
          SLACK_CHANNEL_VENTAS: ${{ secrets.SLACK_CHANNEL_VENTAS }}
          VENTAS_SLACK_CHANNEL: ${{ secrets.VENTAS_SLACK_CHANNEL }}
          SLACK_CHANNEL_VENTAS_BAZAR: ${{ secrets.SLACK_CHANNEL_VENTAS_BAZAR }}
          VENTAS_BAZAR_SLACK_CHANNEL: ${{ secrets.VENTAS_BAZAR_SLACK_CHANNEL }}
          TZ: America/Mexico_City
        run: python scripts/process_issue.py

      - name: Clean inventory mercado
        run: |
          if [ -f scripts/clean_inventory_mercado.py ]; then
            python scripts/clean_inventory_mercado.py
          fi
        env:
          TZ: America/Mexico_City

      - name: Sync menu normal from inventory
        run: |
          if [ -f scripts/sync_menu_from_inventory.py ]; then
            python scripts/sync_menu_from_inventory.py
          fi
        env:
          TZ: America/Mexico_City

      - name: Sync menu mercado from inventory_mercado
        run: |
          if [ -f scripts/sync_menu_mercado_from_inventory.py ]; then
            python scripts/sync_menu_mercado_from_inventory.py
          fi
        env:
          TZ: America/Mexico_City

      - name: Build reports
        run: |
          if [ -f scripts/build_reports.py ]; then
            python scripts/build_reports.py
          fi
        env:
          TZ: America/Mexico_City

      - name: Commit & push
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          TZ: America/Mexico_City
        run: |
          set -e
          git config user.name "inventory-bot"
          git config user.email "actions@users.noreply.github.com"

          branch="${BRANCH_NAME:-$(git rev-parse --abbrev-ref HEAD)}"
          git fetch origin "$branch" --prune

          git add .github/workflows/inventory.yml scripts/process_issue.py
          git add docs/index.html docs/register_merma.html docs/register_merma_mercado.html 2>/dev/null || true
          git add docs/menu.json docs/menu_mercado.json 2>/dev/null || true
          git add data/inventory.csv data/inventory_mercado.csv data/sales.csv data/sales_mercado.csv data/production.csv data/transfer_mercado.csv data/processed_events.csv 2>/dev/null || true
          git add docs/diario docs/mercado/diario docs/ventas_detalle.csv docs/mercado/ventas_detalle.csv docs/ventas_por_dia.csv docs/ventas_por_item.csv docs/produccion_detalle.csv docs/reporte.html 2>/dev/null || true
          git add -A

          if git diff --cached --quiet; then
            echo "Sin cambios para commitear."
            exit 0
          fi

          git commit -m "chore(inventory): actualizar inventarios, menus y reportes"
          git push origin HEAD:"$branch"
