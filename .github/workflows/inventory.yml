name: Inventory Bot

on:
  workflow_dispatch: {}
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas
        env:
          TZ: America/Mexico_City

      - name: Prepare output folders
        run: |
          mkdir -p docs/diario
          mkdir -p docs/mercado/diario
        env:
          TZ: America/Mexico_City

      - name: Run processor
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: America/Mexico_City
        run: python scripts/process_issue.py

      - name: Build reports
        run: python scripts/build_reports.py
        env:
          TZ: America/Mexico_City

      - name: Normalize line endings before commit
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in list(Path("data").rglob("*")) + list(Path("docs").rglob("*")):
              if p.is_file() and p.suffix.lower() in {".csv", ".json", ".html", ".js"}:
                  try:
                      txt = p.read_text(encoding="utf-8", errors="ignore")
                      txt = txt.replace("\r\n", "\n").replace("\r", "\n")
                      p.write_text(txt, encoding="utf-8", newline="\n")
                  except Exception:
                      pass
          PY
        env:
          TZ: America/Mexico_City

      - name: Commit & push
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          TZ: America/Mexico_City
        run: |
          set -e
          git config user.name "inventory-bot"
          git config user.email "actions@users.noreply.github.com"

          branch="${BRANCH_NAME:-$(git rev-parse --abbrev-ref HEAD)}"
          git fetch origin "$branch" --prune

          git add .gitattributes
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios para commitear."
            exit 0
          fi

          git commit -m "chore(inventory): actualizar datos, menu y reportes"
          git push origin HEAD:"$branch"
