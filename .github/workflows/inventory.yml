name: Inventory Bot

on:
  workflow_dispatch: {}
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Prepare folders
        run: |
          mkdir -p docs/diario
          mkdir -p docs/mercado/diario

      - name: Process issue
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
          SLACK_CHANNEL_VENTAS: ${{ secrets.SLACK_CHANNEL_VENTAS }}
          VENTAS_SLACK_CHANNEL: ${{ secrets.VENTAS_SLACK_CHANNEL }}
          SLACK_CHANNEL_VENTAS_BAZAR: ${{ secrets.SLACK_CHANNEL_VENTAS_BAZAR }}
          VENTAS_BAZAR_SLACK_CHANNEL: ${{ secrets.VENTAS_BAZAR_SLACK_CHANNEL }}
          TZ: America/Mexico_City
        run: python scripts/process_issue.py

      - name: Build reports
        env:
          TZ: America/Mexico_City
        run: python scripts/build_reports.py

      - name: Commit and push
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          TZ: America/Mexico_City
        run: |
          set -e
          git config user.name "inventory-bot"
          git config user.email "actions@users.noreply.github.com"

          branch="${BRANCH_NAME:-$(git rev-parse --abbrev-ref HEAD)}"

          git add scripts/process_issue.py scripts/build_reports.py .github/workflows/inventory.yml
          git add data/inventory.csv data/inventory_mercado.csv data/sales.csv data/sales_mercado.csv data/production.csv data/transfer_mercado.csv data/processed_events.csv
          git add docs/ventas_detalle.csv docs/ventas_por_dia.csv docs/ventas_por_item.csv docs/produccion_detalle.csv
          git add docs/mercado/ventas_detalle.csv docs/mercado/ventas_por_dia.csv docs/mercado/ventas_por_item.csv docs/diario docs/mercado/diario
          git add -A

          if git diff --cached --quiet; then
            echo "Sin cambios para commitear."
            exit 0
          fi

          git commit -m "chore(inventory): actualizar inventarios y reportes"

          for i in 1 2 3; do
            echo "Intento de push $i..."
            git fetch origin "$branch"
            git rebase "origin/$branch" || {
              git rebase --abort || true
              echo "Rebase falló."
              exit 1
            }

            if git push origin HEAD:"$branch"; then
              echo "Push exitoso."
              exit 0
            fi
          done

          echo "No se pudo hacer push después de varios intentos."
          exit 1
