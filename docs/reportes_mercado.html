<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ventas del día · Mercado</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <style>
    :root{--bg:#f7f7fb;--card:#ffffff;--line:#e5e7eb;--text:#1f2937;--muted:#6b7280;--shadow:0 8px 24px rgba(0,0,0,.05)}
    *{box-sizing:border-box}
    body{font-family:system-ui,Arial,sans-serif;max-width:1100px;margin:24px auto;padding:0 16px;background:var(--bg);color:var(--text)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
    .back-btn{display:inline-block;text-decoration:none;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:var(--text)}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
    input,select,button{font:inherit;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px;background:#fff}
    button{cursor:pointer}
    table{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
    th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    th{background:#fafafa;position:sticky;top:0;z-index:1}
    .muted{color:var(--muted)}
    .totals{display:flex;gap:20px;flex-wrap:wrap;margin:12px 0 16px}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
    @media print{.topbar a,.row button,.row select,.row input,#status{display:none !important}body{background:#fff;margin:0;max-width:none}.card{box-shadow:none;border:none;padding:0}}
  </style>

</head>
<body>
  <div class="card">
    <div class="topbar">
      <h1 style="margin:0;">Ventas del día · Mercado</h1>
      <a class="back-btn" href="index.html">← Menú</a>
    </div>

    <div class="row">
      <div>
        <label for="fecha">Fecha</label><br>
        <input id="fecha" type="date">
      </div>
      <div>
        <label for="metodo">Método de pago</label><br>
        <select id="metodo">
          <option value="todos">Todos</option>
          <option value="efectivo">Efectivo</option>
          <option value="tarjeta">Tarjeta</option>
        </select>
      </div>
      <div><button id="cargar" type="button">Cargar</button></div>
      <div><button id="imprimir" type="button">Imprimir</button></div>
      <div><button id="excel" type="button">Excel del día</button></div>
    </div>

    <div class="totals">
      <div><strong>Registros:</strong> <span id="count">0</span></div>
      <div><strong>Unidades:</strong> <span id="units">0</span></div>
      <div><strong>Total:</strong> <span id="total">$0.00</span></div>
    </div>

    <div class="muted" id="status">Selecciona una fecha y presiona Cargar.</div>

    <div class="table-wrap" style="margin-top:12px;">
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>SKU</th>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio unitario</th>
            <th>Importe</th>
            <th>Método</th>
            <th>Issue</th>
            <th>Txn</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    window.EXPORT_PREFIX = "ventas-mercado";

    const PAL_GRANDES_ORDER = [
      "BAILEYS","BESO D ÁNGEL","CAPUCHINO","CHICLE","CHOCOLATE","DURAZNO&CREMA","FERRERO",
      "FRESA agua","FRESA crema","GROSELLA","GUANABANA","GUAYABA","KIWI","KAHLÚA","LIMÓN",
      "LIMÓN CHAMOY","MAMEY","MANDARINA","MANGO","MANGO CHAMOY","NUEZ","NUTELLA","OREO",
      "PAY DE LIMÓN","PERRO","PICAFRESA","PICAPANDAS","PIÑA","PIÑA CHAMOY","PIÑON",
      "PISTACHE","PULPARINDO","QUESO","QUESO/ZARZA","RAFFAELLO","ROMPOPE","RÓN PASAS",
      "SALTED CARAMEL","SANDÍA","SANDÍA CHAMOY","SELVA BLANCA","SELVA NEGRA","SNICKERS",
      "TAMARINDO","TARO","UVA","VAINILLA","VINO","ZAPOTE","PERLA NEGRA","PIÑA COLADA",
      "TEQUILA","CAJETA SA","CAPUKETO","CHOCOFRESA K","CHOCOKETO","COCOKETO","FERREROKETO",
      "FRESA SA","FRUTOSKETO","GROSELLA SA","GUANABANASA","LIMONCHM SA","LIMÓNMENTA",
      "MAMEY SA","MANGO SA","MAZAKETO","MENTAKETO","NUEZKETO","PIÑONKETO","PISTAKETO","VAINILLAKETO"
    ];

    const PAL_GRANDES_ALIASES = {
      "BAILEYS": ["BAILEYS"],
      "BESO D ÁNGEL": ["BESO DE ANGEL","BESO D ANGEL","BESO D ÁNGEL"],
      "CAPUCHINO": ["CAPUCHINO"],
      "CHICLE": ["CHICLE"],
      "CHOCOLATE": ["CHOCOLATE"],
      "DURAZNO&CREMA": ["DURAZNO CREMA","DURAZNOS CON CREMA","DURAZNO&CREMA"],
      "FERRERO": ["FERRERO"],
      "FRESA agua": ["PALETA AGUA FRESA","FRESA AGUA"],
      "FRESA crema": ["FRESA CREMA","FRESA CON CREMA","PALETA CREMA FRESA"],
      "GROSELLA": ["GROSELLA","GROSSELLA"],
      "GUANABANA": ["GUANABANA"],
      "GUAYABA": ["GUAYABA"],
      "KIWI": ["KIWI"],
      "KAHLÚA": ["KAHLUA","KAHLÚA"],
      "LIMÓN": ["LIMON","LIMÓN"],
      "LIMÓN CHAMOY": ["LIMON CHAMOY","LIMÓN CHAMOY"],
      "MAMEY": ["MAMEY"],
      "MANDARINA": ["MANDARINA"],
      "MANGO": ["PALETA AGUA MANGO","MANGO"],
      "MANGO CHAMOY": ["MANGO CHAMOY"],
      "NUEZ": ["NUEZ"],
      "NUTELLA": ["NUTELLA"],
      "OREO": ["OREO"],
      "PAY DE LIMÓN": ["PAY DE LIMON","PAY DE LIMÓN"],
      "PERRO": ["PALETAS PERRO","PALETA PARA PERRO","PERRO"],
      "PICAFRESA": ["PICAFRESA"],
      "PICAPANDAS": ["PICAPANDA","PICAPANDAS"],
      "PIÑA": ["PINA","PIÑA"],
      "PIÑA CHAMOY": ["PINA CHAMOY","PIÑA CHAMOY"],
      "PIÑON": ["PINON","PIÑON"],
      "PISTACHE": ["PISTACHE"],
      "PULPARINDO": ["PULPARINDO"],
      "QUESO": ["QUESO"],
      "QUESO/ZARZA": ["QUESO CON ZARZAMORA","QUESO ZARZA","QUESO/ZARZA"],
      "RAFFAELLO": ["RAFFAELLO","RAFAELLO"],
      "ROMPOPE": ["ROMPOPE"],
      "RÓN PASAS": ["RON CON PASAS","RÓN PASAS","RON PASAS"],
      "SALTED CARAMEL": ["SALTED CARAMEL"],
      "SANDÍA": ["SANDIA","SANDÍA"],
      "SANDÍA CHAMOY": ["SANDIA CHAMOY","SANDÍA CHAMOY"],
      "SELVA BLANCA": ["SELVA BLANCA"],
      "SELVA NEGRA": ["SELVA NEGRA"],
      "SNICKERS": ["SNICKERS"],
      "TAMARINDO": ["TAMARINDO"],
      "TARO": ["TARO"],
      "UVA": ["UVA"],
      "VAINILLA": ["VAINILLA"],
      "VINO": ["VINO TINTO","VINO"],
      "ZAPOTE": ["ZAPOTE"],
      "PERLA NEGRA": ["PERLA NEGRA"],
      "PIÑA COLADA": ["PINA COLADA","PIÑA COLADA"],
      "TEQUILA": ["TEQUILA"],
      "CAJETA SA": ["CAJETA SA"],
      "CAPUKETO": ["CAPUKETO"],
      "CHOCOFRESA K": ["CHOCOFRESA K"],
      "CHOCOKETO": ["CHOCOKETO"],
      "COCOKETO": ["COCOKETO"],
      "FERREROKETO": ["FERREROKETO"],
      "FRESA SA": ["FRESA SA"],
      "FRUTOSKETO": ["FRUTOSKETO"],
      "GROSELLA SA": ["GROSELLA SA","GROSSELLA SA"],
      "GUANABANASA": ["GUANABANASA","GUANABANA SA"],
      "LIMONCHM SA": ["LIMONCHM SA","LIMON CHM SA","LIMÓN CHM SA"],
      "LIMÓNMENTA": ["LIMONMENTA","LIMÓNMENTA"],
      "MAMEY SA": ["MAMEY SA"],
      "MANGO SA": ["MANGO SA"],
      "MAZAKETO": ["MAZAKETO","MAZAPAN KETO"],
      "MENTAKETO": ["MENTAKETO"],
      "NUEZKETO": ["NUEZKETO"],
      "PIÑONKETO": ["PINONKETO","PIÑONKETO"],
      "PISTAKETO": ["PISTAKETO"],
      "VAINILLAKETO": ["VAINILLAKETO"]
    };

    const FLAVOR_CACHE = new Map();
    Object.entries(PAL_GRANDES_ALIASES).forEach(([target, aliases]) => {
      aliases.forEach(alias => FLAVOR_CACHE.set(normalizeText(alias), target));
    });

    let _rowsFull = [];
    let _metodo = "todos";

    function money(n){ return `$${Number(n || 0).toFixed(2)}`; }
    function todayISO(){
      const d = new Date();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${d.getFullYear()}-${m}-${day}`;
    }
    function skuToNice(sku){ return String(sku || "").replaceAll("-", " "); }
    function normalizeText(value){
      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toUpperCase()
        .replace(/&/g, " ")
        .replace(/[\/]/g, " ")
        .replace(/[-_]/g, " ")
        .replace(/[^\w\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }
    function parseCSV(text){
      const lines = text.trim().split(/\r?\n/);
      if (!lines.length) return [];
      const headers = [];
      let current = "";
      let inQuotes = false;

      for (let i = 0; i < lines[0].length; i++) {
        const ch = lines[0][i];
        if (ch === '"') inQuotes = !inQuotes;
        else if (ch === "," && !inQuotes) { headers.push(current.trim()); current = ""; }
        else current += ch;
      }
      headers.push(current.trim());

      const rows = [];
      for (let i = 1; i < lines.length; i++) {
        const line = lines[i];
        if (!line.trim()) continue;

        const cols = [];
        let value = "";
        let quoted = false;

        for (let j = 0; j < line.length; j++) {
          const ch = line[j];
          if (ch === '"') {
            if (quoted && line[j + 1] === '"') { value += '"'; j++; }
            else quoted = !quoted;
          } else if (ch === "," && !quoted) {
            cols.push(value); value = "";
          } else {
            value += ch;
          }
        }
        cols.push(value);

        const row = {};
        headers.forEach((h, idx) => row[h] = cols[idx] ?? "");
        rows.push(row);
      }
      return rows;
    }
    async function fetchText(url){
      const r = await fetch(url + "?_=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error(`${r.status} ${url}`);
      return r.text();
    }
    function rowsForCurrentFilter(){
      const rows = Array.isArray(_rowsFull) ? _rowsFull.slice() : [];
      if (_metodo === "todos") return rows;
      return rows.filter(r => (r.metodo_pago || "efectivo") === _metodo);
    }
    function mapPaletaGrandeFlavor(row){
      const candidates = [row.item || "", row.descripcion || "", skuToNice(row.item || "")];
      for (const raw of candidates) {
        const normalized = normalizeText(raw);
        if (!normalized) continue;
        if (FLAVOR_CACHE.has(normalized)) return FLAVOR_CACHE.get(normalized);
        for (const [target, aliases] of Object.entries(PAL_GRANDES_ALIASES)) {
          if (aliases.some(alias => normalized.includes(normalizeText(alias)))) return target;
        }
      }
      return null;
    }
    function buildResumenPorProducto(rows){
      const bucket = new Map();
      rows.forEach(r => {
        const key = `${r.item || ""}|||${r.descripcion || skuToNice(r.item || "")}`;
        const current = bucket.get(key) || { "SKU": r.item || "", "Producto": r.descripcion || skuToNice(r.item || ""), "Cantidad": 0, "Importe": 0 };
        current["Cantidad"] += Number(r.cantidad || 0);
        current["Importe"] += Number(r.importe || (Number(r.cantidad || 0) * Number(r.precio_unit || 0)));
        bucket.set(key, current);
      });
      return Array.from(bucket.values()).sort((a, b) => {
        if (b["Cantidad"] !== a["Cantidad"]) return b["Cantidad"] - a["Cantidad"];
        if (b["Importe"] !== a["Importe"]) return b["Importe"] - a["Importe"];
        return String(a["Producto"]).localeCompare(String(b["Producto"]));
      });
    }
    function buildPaletasGrandesSheet(rows){
      const totals = new Map();
      PAL_GRANDES_ORDER.forEach(name => totals.set(name, { "Sabor": name, "Cantidad": 0, "Importe": 0 }));
      rows.forEach(r => {
        const flavor = mapPaletaGrandeFlavor(r);
        if (!flavor || !totals.has(flavor)) return;
        const current = totals.get(flavor);
        current["Cantidad"] += Number(r.cantidad || 0);
        current["Importe"] += Number(r.importe || (Number(r.cantidad || 0) * Number(r.precio_unit || 0)));
      });
      return PAL_GRANDES_ORDER.map(name => totals.get(name));
    }
    function exportRowsToCsv(rows, fecha){
      const headers = ["Fecha","SKU","Producto","Cantidad","Precio unitario","Importe","Método de pago","Issue","Txn"];
      const escapeCsv = (value) => {
        const s = String(value ?? "");
        return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
      };
      const lines = [
        headers.join(","),
        ...rows.map(r => [
          r.fecha || fecha, r.item || "", r.descripcion || skuToNice(r.item || ""),
          Number(r.cantidad || 0), Number(r.precio_unit || 0),
          Number(r.importe || (Number(r.cantidad || 0) * Number(r.precio_unit || 0))),
          (r.metodo_pago || "efectivo"), r.issue || "", r.txn_id || ""
        ].map(escapeCsv).join(","))
      ];
      const csv = "\uFEFF" + lines.join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const suffix = _metodo === "todos" ? "todos" : _metodo;
      a.href = url;
      a.download = `${window.EXPORT_PREFIX || "ventas"}-${fecha}-${suffix}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }
    function exportExcelDelDia(){
      const fecha = document.getElementById("fecha").value;
      if (!fecha) return alert("Selecciona una fecha");
      const rows = rowsForCurrentFilter();
      if (!rows.length) return alert("No hay ventas para exportar");
      if (!window.XLSX) { exportRowsToCsv(rows, fecha); return; }

      const detalle = rows.map(r => ({
        "Fecha": r.fecha || fecha,
        "SKU": r.item || "",
        "Producto": r.descripcion || skuToNice(r.item || ""),
        "Cantidad": Number(r.cantidad || 0),
        "Precio unitario": Number(r.precio_unit || 0),
        "Importe": Number(r.importe || (Number(r.cantidad || 0) * Number(r.precio_unit || 0))),
        "Método de pago": (r.metodo_pago || "efectivo"),
        "Issue": r.issue || "",
        "Txn": r.txn_id || ""
      }));

      const resumenProducto = buildResumenPorProducto(rows);
      const paletasGrandes = buildPaletasGrandesSheet(rows);
      const totalUnidades = detalle.reduce((s, r) => s + Number(r["Cantidad"] || 0), 0);
      const totalImporte = detalle.reduce((s, r) => s + Number(r["Importe"] || 0), 0);

      const wb = XLSX.utils.book_new();

      const wsPaletas = XLSX.utils.json_to_sheet(paletasGrandes);
      wsPaletas["!cols"] = [{ wch: 24 }, { wch: 12 }, { wch: 14 }];
      XLSX.utils.book_append_sheet(wb, wsPaletas, "Paletas grandes");

      const wsResumenProd = XLSX.utils.json_to_sheet(resumenProducto);
      wsResumenProd["!cols"] = [{ wch: 34 }, { wch: 42 }, { wch: 12 }, { wch: 14 }];
      XLSX.utils.book_append_sheet(wb, wsResumenProd, "Resumen por producto");

      const wsDetalle = XLSX.utils.json_to_sheet(detalle);
      wsDetalle["!cols"] = [{ wch: 12 }, { wch: 30 }, { wch: 36 }, { wch: 10 }, { wch: 14 }, { wch: 14 }, { wch: 16 }, { wch: 45 }, { wch: 18 }];
      XLSX.utils.book_append_sheet(wb, wsDetalle, "Detalle");

      const resumen = [["Fecha", fecha],["Filtro", _metodo],["Registros", detalle.length],["Unidades", totalUnidades],["Importe", totalImporte]];
      const wsResumen = XLSX.utils.aoa_to_sheet(resumen);
      wsResumen["!cols"] = [{ wch: 18 }, { wch: 18 }];
      XLSX.utils.book_append_sheet(wb, wsResumen, "Resumen");

      const suffix = _metodo === "todos" ? "todos" : _metodo;
      XLSX.writeFile(wb, `${window.EXPORT_PREFIX || "ventas"}-${fecha}-${suffix}.xlsx`);
    }
    function render(){
      const rows = rowsForCurrentFilter();
      const tbody = document.getElementById("tbody");
      tbody.innerHTML = rows.map(r => `
        <tr>
          <td>${r.fecha || ""}</td>
          <td>${r.item || ""}</td>
          <td>${r.descripcion || skuToNice(r.item || "")}</td>
          <td>${Number(r.cantidad || 0)}</td>
          <td>${money(r.precio_unit)}</td>
          <td>${money(r.importe || (Number(r.cantidad || 0) * Number(r.precio_unit || 0)))}</td>
          <td>${r.metodo_pago || "efectivo"}</td>
          <td>${r.issue || ""}</td>
          <td>${r.txn_id || ""}</td>
        </tr>
      `).join("");
      const units = rows.reduce((s, r) => s + Number(r.cantidad || 0), 0);
      const total = rows.reduce((s, r) => s + Number(r.importe || (Number(r.cantidad || 0) * Number(r.precio_unit || 0))), 0);
      document.getElementById("count").textContent = String(rows.length);
      document.getElementById("units").textContent = String(units);
      document.getElementById("total").textContent = money(total);
      document.getElementById("status").textContent = rows.length ? "Ventas cargadas." : "No hay ventas para ese filtro.";
    }


    async function loadRowsByDate(fecha){
      const dailyPath = `mercado/diario/${fecha}-ventas.csv`;
      try {
        const csv = await fetchText(dailyPath);
        return parseCSV(csv).map(r => ({
          fecha: r.fecha || r.Fecha || fecha,
          item: r.item || r.SKU || "",
          descripcion: r.descripcion || r.Producto || "",
          cantidad: Number(r.cantidad || r.Cantidad || 0),
          precio_unit: Number(r.precio_unit || r["Precio unitario"] || 0),
          importe: Number(r.importe || r.Importe || 0),
          metodo_pago: String(r.metodo_pago || r["Método de pago"] || "efectivo").toLowerCase(),
          issue: r.issue || r.Issue || "",
          txn_id: r.txn_id || r.Txn || ""
        }));
      } catch (_) {
        const csv = await fetchText("mercado/ventas_detalle.csv");
        return parseCSV(csv)
          .map(r => ({
            fecha: r.fecha || r.Fecha || "",
            item: r.item || r.SKU || "",
            descripcion: r.descripcion || r.Producto || "",
            cantidad: Number(r.cantidad || r.Cantidad || 0),
            precio_unit: Number(r.precio_unit || r["Precio unitario"] || 0),
            importe: Number(r.importe || r.Importe || 0),
            metodo_pago: String(r.metodo_pago || r["Método de pago"] || "efectivo").toLowerCase(),
            issue: r.issue || r.Issue || "",
            txn_id: r.txn_id || r.Txn || ""
          }))
          .filter(r => String(r.fecha || "").slice(0, 10) === fecha);
      }
    }

    async function cargar(){
      const fecha = document.getElementById("fecha").value;
      _metodo = document.getElementById("metodo").value;
      if (!fecha) return alert("Selecciona una fecha");
      document.getElementById("status").textContent = "Cargando…";
      try {
        _rowsFull = await loadRowsByDate(fecha);
        render();
      } catch (error) {
        console.error(error);
        _rowsFull = [];
        render();
        document.getElementById("status").textContent = "Error al cargar ventas de mercado.";
      }
    }

    document.getElementById("fecha").value = todayISO();
    document.getElementById("cargar").onclick = cargar;
    document.getElementById("metodo").onchange = () => {
      _metodo = document.getElementById("metodo").value;
      render();
    };
    document.getElementById("imprimir").onclick = () => window.print();
    document.getElementById("excel").onclick = () => exportExcelDelDia();
  </script>
</body>
</html>
