<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Corregir venta</title>
  <style>
    :root{--bg:#f7f7fb;--card:#fff;--line:#e5e7eb;--text:#1f2937;--muted:#6b7280;--brand:#0f62fe;--shadow:0 6px 16px rgba(0,0,0,.05)}
    *{box-sizing:border-box} body{font-family:system-ui,Arial,sans-serif;max-width:820px;margin:10px auto;padding:0 10px;background:var(--bg);color:var(--text)}
    .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)} .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
    .back{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 10px;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:var(--text);text-decoration:none;font-weight:700}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px} @media(max-width:700px){.grid{grid-template-columns:1fr}}
    input,select,textarea,button{font:inherit} input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;background:#fff} textarea{min-height:96px;resize:vertical}
    button{padding:10px 12px;border:1px solid #d1d5db;border-radius:10px;background:#fff;cursor:pointer;font-weight:700} .primary{background:var(--brand);border-color:var(--brand);color:#fff}
    .muted{color:var(--muted);font-size:12px} .stack{display:grid;gap:8px}
  </style>
  <script src="config.js"></script>
</head>
<body>
  <div class="card">
    <div class="top">
      <div><h1 style="margin:0;font-size:22px;">Corregir venta</h1><div class="muted">Genera una corrección sin borrar el historial original.</div></div>
      <a class="back" href="index.html">← Menú</a>
    </div>
    <div class="stack">
      <div class="grid">
        <div><div class="muted">Alcance</div><select id="scope"><option value="normal">Normal</option><option value="mercado">Mercado</option></select></div>
        <div><div class="muted">Fecha original</div><input id="fecha" type="date"></div>
        <div><div class="muted">Txn ID</div><input id="txn" type="text" placeholder="Ej. txn-..."></div>
        <div><div class="muted">Issue</div><input id="issue" type="text" placeholder="Ej. 123"></div>
        <div><div class="muted">Acción</div><select id="accion"><option value="cancelar">Cancelar venta</option><option value="ajustar">Ajustar cantidades/precios</option></select></div>
        <div><div class="muted">Método pago corregido</div><select id="metodo"><option value="">Sin cambio</option><option value="efectivo">Efectivo</option><option value="tarjeta">Tarjeta</option><option value="transferencia">Transferencia</option></select></div>
      </div>
      <div><div class="muted">Detalle de corrección</div><textarea id="detalle" placeholder="Una línea por producto. Formato: SKU | CANTIDAD | PRECIO&#10;Ejemplo: PALETA-CREMA-OREO | 2 | 30&#10;Si cancelas la venta, aquí puedes dejar la razón."></textarea></div>
      <div><div class="muted">Razón</div><textarea id="razon" placeholder="Ej. me equivoqué al cobrar / metí un producto de más / error de cantidad"></textarea></div>
      <div class="grid">
        <button id="githubBtn" type="button">Abrir issue en GitHub</button>
        <button id="apiBtn" class="primary" type="button">Enviar corrección</button>
      </div>
    </div>
  </div>
  <script>
    const APP_CONFIG = window.APP_CONFIG || {};
    const ORG = APP_CONFIG.ORG || "OswaldoCasillas";
    const REPO = APP_CONFIG.REPO || "Ventas";
    const API_URL = APP_CONFIG.API_URL || "https://ventas-backend-rose.vercel.app/api/create-issue";
    function qs(k){ return new URLSearchParams(location.search).get(k) || ""; }
    function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
    document.getElementById("scope").value = qs("scope") || "normal";
    document.getElementById("fecha").value = qs("fecha") || todayISO();
    document.getElementById("txn").value = qs("txn_id");
    document.getElementById("issue").value = qs("issue");

    function buildPayload(){
      const scope = document.getElementById("scope").value;
      return {
        type: scope === "mercado" ? "correccion_venta_mkt" : "correccion_venta",
        fecha: document.getElementById("fecha").value,
        txn_id: document.getElementById("txn").value.trim(),
        issue_ref: document.getElementById("issue").value.trim(),
        accion: document.getElementById("accion").value,
        metodo_pago: document.getElementById("metodo").value,
        detalle: document.getElementById("detalle").value,
        razon: document.getElementById("razon").value
      };
    }
    function buildGitHubUrl(){
      const p = buildPayload();
      const labels = p.type === "correccion_venta_mkt" ? "correccion-venta,mercado" : "correccion-venta";
      const title = `[${p.type}] ${p.txn_id || p.issue_ref || p.fecha}`;
      const body = `tipo: ${p.type}\nfecha: ${p.fecha}\ntxn_id: ${p.txn_id}\nissue_ref: ${p.issue_ref}\naccion: ${p.accion}\nmetodo_pago: ${p.metodo_pago}\n\ndetalle:\n${p.detalle}\n\nrazon:\n${p.razon}`;
      const u = new URL(`https://github.com/${ORG}/${REPO}/issues/new`);
      u.searchParams.set("title", title); u.searchParams.set("body", body); u.searchParams.set("labels", labels);
      return u.toString();
    }
    document.getElementById("githubBtn").onclick = () => location.href = buildGitHubUrl();
    document.getElementById("apiBtn").onclick = async () => {
      const p = buildPayload();
      if (!p.fecha || (!p.txn_id && !p.issue_ref)) return alert("Pon fecha y txn o issue.");
      if (!API_URL) return alert("Falta API_URL");
      try {
        const resp = await fetch(API_URL, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify(p)
        });
        if (!resp.ok) {
          let msg = resp.statusText;
          try { const j = await resp.json(); msg = j.error || JSON.stringify(j); } catch(_){
          }
          return alert("No se pudo enviar: " + msg);
        }
        const data = await resp.json().catch(()=>({}));
        alert(`Corrección enviada ✅${data.number ? ` (issue #${data.number})` : ""}`);
      } catch(err) {
        alert("No se pudo enviar la corrección.");
      }
    };
  </script>
</body>
</html>
