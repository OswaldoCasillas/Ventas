<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ventas del día</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body{font-family:system-ui,Arial,sans-serif;max-width:1100px;margin:24px auto;padding:0 16px;background:#f7f7fb;color:#1f2937}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.05)}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
    input,select,button{font:inherit;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px}
    button{cursor:pointer}
    table{width:100%;border-collapse:collapse;background:#fff}
    th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}
    .muted{color:#6b7280}
    .totals{display:flex;gap:20px;flex-wrap:wrap;margin:12px 0}
  </style>
</head>
<body>
  <div class="card">
    <h1>Ventas del día</h1>
    <div class="row">
      <div>
        <label>Fecha</label><br>
        <input id="fecha" type="date">
      </div>
      <div>
        <label>Método de pago</label><br>
        <select id="metodo">
          <option value="todos">Todos</option>
          <option value="efectivo">Efectivo</option>
          <option value="tarjeta">Tarjeta</option>
        </select>
      </div>
      <div><button id="cargar">Cargar</button></div>
      <div><button id="imprimir">Imprimir</button></div>
      <div><button id="excel">Excel del día</button></div>
    </div>

    <div class="totals">
      <div><strong>Registros:</strong> <span id="count">0</span></div>
      <div><strong>Unidades:</strong> <span id="units">0</span></div>
      <div><strong>Total:</strong> <span id="total">$0.00</span></div>
    </div>

    <div class="muted" id="status">Selecciona una fecha y presiona Cargar.</div>
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>SKU</th>
          <th>Producto</th>
          <th>Cantidad</th>
          <th>Precio unitario</th>
          <th>Importe</th>
          <th>Método</th>
          <th>Issue</th>
          <th>Txn</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    let _rowsFull = [];
    let _metodo = "todos";

    function money(n){ return `$${Number(n || 0).toFixed(2)}`; }
    function todayISO(){
      const d = new Date();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const day = String(d.getDate()).padStart(2,"0");
      return `${d.getFullYear()}-${m}-${day}`;
    }

    function skuToNice(sku){
      return String(sku || "").replaceAll("-", " ");
    }

    function parseCSV(text){
      const lines = text.trim().split(/\r?\n/);
      if (!lines.length) return [];
      const headers = lines[0].split(",").map(h => h.trim());
      const rows = [];
      for (let i = 1; i < lines.length; i++) {
        const line = lines[i];
        const cols = [];
        let cur = "", inQ = false;
        for (let j = 0; j < line.length; j++) {
          const ch = line[j];
          if (ch === '"') {
            if (inQ && line[j+1] === '"') { cur += '"'; j++; }
            else inQ = !inQ;
          } else if (ch === "," && !inQ) {
            cols.push(cur); cur = "";
          } else {
            cur += ch;
          }
        }
        cols.push(cur);
        const row = {};
        headers.forEach((h, idx) => row[h] = cols[idx] ?? "");
        rows.push(row);
      }
      return rows;
    }

    async function fetchText(url){
      const r = await fetch(url + "?_=" + Date.now(), {cache:"no-store"});
      if(!r.ok) throw new Error(`${r.status} ${url}`);
      return r.text();
    }

    async function loadRowsByDate(fecha){
      const dailyPath = `diario/${fecha}-ventas.csv`;
      try{
        const csv = await fetchText(dailyPath);
        return parseCSV(csv).map(r => ({
          fecha: r.fecha || r.Fecha || fecha,
          item: r.item || r.SKU || "",
          descripcion: r.descripcion || r.Producto || "",
          cantidad: Number(r.cantidad || r.Cantidad || 0),
          precio_unit: Number(r.precio_unit || r["Precio unitario"] || 0),
          importe: Number(r.importe || r.Importe || 0),
          metodo_pago: (r.metodo_pago || r["Método de pago"] || "efectivo").toLowerCase(),
          issue: r.issue || r.Issue || "",
          txn_id: r.txn_id || r.Txn || ""
        }));
      }catch(_){
        const csv = await fetchText("ventas_detalle.csv");
        return parseCSV(csv)
          .map(r => ({
            fecha: r.fecha || r.Fecha || "",
            item: r.item || r.SKU || "",
            descripcion: r.descripcion || r.Producto || "",
            cantidad: Number(r.cantidad || r.Cantidad || 0),
            precio_unit: Number(r.precio_unit || r["Precio unitario"] || 0),
            importe: Number(r.importe || r.Importe || 0),
            metodo_pago: (r.metodo_pago || r["Método de pago"] || "efectivo").toLowerCase(),
            issue: r.issue || r.Issue || "",
            txn_id: r.txn_id || r.Txn || ""
          }))
          .filter(r => String(r.fecha || "").slice(0,10) === fecha);
      }
    }

    function rowsForCurrentFilter(){
      const rows = Array.isArray(_rowsFull) ? _rowsFull.slice() : [];
      if (_metodo === "todos") return rows;
      return rows.filter(r => (r.metodo_pago || "efectivo") === _metodo);
    }

    function render(){
      const rows = rowsForCurrentFilter();
      const tbody = document.getElementById("tbody");
      tbody.innerHTML = rows.map(r => `
        <tr>
          <td>${r.fecha || ""}</td>
          <td>${r.item || ""}</td>
          <td>${r.descripcion || skuToNice(r.item || "")}</td>
          <td>${Number(r.cantidad || 0)}</td>
          <td>${money(r.precio_unit)}</td>
          <td>${money(r.importe || (Number(r.cantidad||0)*Number(r.precio_unit||0)))}</td>
          <td>${r.metodo_pago || "efectivo"}</td>
          <td>${r.issue || ""}</td>
          <td>${r.txn_id || ""}</td>
        </tr>
      `).join("");

      const units = rows.reduce((s,r)=>s+Number(r.cantidad||0),0);
      const total = rows.reduce((s,r)=>s+Number(r.importe || (Number(r.cantidad||0)*Number(r.precio_unit||0))),0);

      document.getElementById("count").textContent = String(rows.length);
      document.getElementById("units").textContent = String(units);
      document.getElementById("total").textContent = money(total);
      document.getElementById("status").textContent = rows.length ? "Ventas cargadas." : "No hay ventas para ese filtro.";
    }


    function buildResumenPorProducto(rows){
      const map = new Map();

      rows.forEach((r) => {
        const sku = String(r.item || "").trim();
        const producto = String(r.descripcion || skuToNice(sku)).trim();
        const precio = Number(r.precio_unit || 0);
        const cantidad = Number(r.cantidad || 0);
        const importe = Number(
          r.importe || (Number(r.cantidad || 0) * Number(r.precio_unit || 0))
        );

        const key = sku || producto;
        if (!map.has(key)) {
          map.set(key, {
            "SKU": sku,
            "Producto": producto,
            "Cantidad total": 0,
            "Importe total": 0,
            "Precio referencia": precio
          });
        }

        const acc = map.get(key);
        acc["Cantidad total"] += cantidad;
        acc["Importe total"] += importe;
        if (!acc["Precio referencia"] && precio) acc["Precio referencia"] = precio;
      });

      return Array.from(map.values()).sort((a, b) => {
        if (b["Cantidad total"] !== a["Cantidad total"]) {
          return b["Cantidad total"] - a["Cantidad total"];
        }
        return String(a["Producto"]).localeCompare(String(b["Producto"]));
      });
    }

    function exportRowsToCsv(rows, fecha){
      const headers = ["Fecha","SKU","Producto","Cantidad","Precio unitario","Importe","Método de pago","Issue","Txn"];
      const escapeCsv = (value) => {
        const s = String(value ?? "");
        return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
      };

      const lines = [
        headers.join(","),
        ...rows.map(r => [
          r.fecha || fecha,
          r.item || "",
          r.descripcion || skuToNice(r.item || ""),
          Number(r.cantidad || 0),
          Number(r.precio_unit || 0),
          Number(r.importe || (Number(r.cantidad || 0) * Number(r.precio_unit || 0))),
          (r.metodo_pago || "efectivo"),
          r.issue || "",
          r.txn_id || ""
        ].map(escapeCsv).join(","))
      ];

      const csv = "\uFEFF" + lines.join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      const suffix = _metodo === "todos" ? "todos" : _metodo;
      a.href = url;
      a.download = `ventas-${fecha}-${suffix}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function exportExcelDelDia(){
      const fecha = document.getElementById("fecha").value;
      if(!fecha) return alert("Selecciona una fecha");

      const rows = rowsForCurrentFilter();
      if(!rows.length) return alert("No hay ventas para exportar");

      if (!window.XLSX) {
        exportRowsToCsv(rows, fecha);
        return;
      }

      const detalle = rows.map(r => ({
        "Fecha": r.fecha || fecha,
        "SKU": r.item || "",
        "Producto": r.descripcion || skuToNice(r.item || ""),
        "Cantidad": Number(r.cantidad || 0),
        "Precio unitario": Number(r.precio_unit || 0),
        "Importe": Number(r.importe || (Number(r.cantidad || 0) * Number(r.precio_unit || 0))),
        "Método de pago": (r.metodo_pago || "efectivo"),
        "Issue": r.issue || "",
        "Txn": r.txn_id || ""
      }));

      const resumenProductos = buildResumenPorProducto(rows);
      const totalUnidades = detalle.reduce((s, r) => s + Number(r["Cantidad"] || 0), 0);
      const totalImporte = detalle.reduce((s, r) => s + Number(r["Importe"] || 0), 0);

      const wb = XLSX.utils.book_new();

      const wsResumenProductos = XLSX.utils.json_to_sheet(resumenProductos);
      wsResumenProductos["!cols"] = [
        { wch: 28 },
        { wch: 36 },
        { wch: 14 },
        { wch: 14 },
        { wch: 16 }
      ];
      XLSX.utils.book_append_sheet(wb, wsResumenProductos, "Resumen por producto");

      const wsDetalle = XLSX.utils.json_to_sheet(detalle);
      wsDetalle["!cols"] = [
        { wch: 12 }, { wch: 30 }, { wch: 36 }, { wch: 10 }, { wch: 14 },
        { wch: 14 }, { wch: 16 }, { wch: 45 }, { wch: 16 }
      ];
      XLSX.utils.book_append_sheet(wb, wsDetalle, "Detalle");

      const resumen = [
        ["Fecha", fecha],
        ["Filtro", _metodo],
        ["Productos únicos", resumenProductos.length],
        ["Registros detalle", detalle.length],
        ["Unidades", totalUnidades],
        ["Importe", totalImporte]
      ];
      const wsResumen = XLSX.utils.aoa_to_sheet(resumen);
      wsResumen["!cols"] = [{ wch: 18 }, { wch: 18 }];
      XLSX.utils.book_append_sheet(wb, wsResumen, "Resumen");

      const suffix = _metodo === "todos" ? "todos" : _metodo;
      XLSX.writeFile(wb, `ventas-${fecha}-${suffix}.xlsx`);
    }

    async function cargar(){
      const fecha = document.getElementById("fecha").value;
      _metodo = document.getElementById("metodo").value;
      if(!fecha) return alert("Selecciona una fecha");
      document.getElementById("status").textContent = "Cargando…";
      try{
        _rowsFull = await loadRowsByDate(fecha);
        render();
      }catch(error){
        console.error(error);
        document.getElementById("status").textContent = "Error al cargar ventas.";
        _rowsFull = [];
        render();
      }
    }

    document.getElementById("fecha").value = todayISO();
    document.getElementById("cargar").onclick = cargar;
    document.getElementById("metodo").onchange = () => { _metodo = document.getElementById("metodo").value; render(); };
    document.getElementById("imprimir").onclick = ()=>window.print();
    document.getElementById("excel").onclick = ()=>exportExcelDelDia();
  </script>
</body>
</html>
