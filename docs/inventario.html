<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventario normal</title>
<style>
:root{--bg:#f7f7fb;--card:#fff;--line:#e5e7eb;--text:#1f2937;--muted:#6b7280;--shadow:0 6px 16px rgba(0,0,0,.05)} *{box-sizing:border-box} body{font-family:system-ui,Arial,sans-serif;max-width:1080px;margin:10px auto;padding:0 10px;background:var(--bg);color:var(--text)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)} .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.back{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 10px;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:var(--text);text-decoration:none;font-weight:700}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px} input,select,button{font:inherit;padding:9px 10px;border:1px solid #d1d5db;border-radius:10px;background:#fff} button{cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:12px} th,td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.sku{font-size:10px;color:var(--muted)}
</style></head><body><div class="card"><div class="top"><div><h1 style="margin:0;font-size:22px;">Inventario normal</h1><div class="sku">Con botón de ajustar.</div></div><a class="back" href="inventarios.html">← Inventarios</a></div><div class="filters"><input id="search" type="text" placeholder="Buscar"><button id="reload" type="button">Recargar</button></div><table><thead><tr><th>SKU</th><th>Descripción</th><th>Stock</th><th>Precio</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div><script>
let MENU=[]; async function fetchJSON(url){const r=await fetch(url+"?_="+Date.now(),{cache:"no-store"}); if(!r.ok) throw new Error(url); return r.json();}
function qs(v){return String(v||"").toLowerCase();} function filtered(){const q=qs(document.getElementById("search").value); return MENU.filter(r=>!q || qs(r.item).includes(q) || qs(r.descripcion).includes(q)).sort((a,b)=>String(a.descripcion||"").localeCompare(String(b.descripcion||"")));} 
function adjustUrl(r){ const u=new URL("ajustar_inventario.html", location.href); u.searchParams.set("scope","normal"); u.searchParams.set("sku", r.item||""); u.searchParams.set("descripcion", r.descripcion||""); return u.toString(); }
function render(){ const rows=filtered(); document.getElementById("tbody").innerHTML=rows.map(r=>`<tr><td>${r.item}<div class="sku">${r.product_id||""}</div></td><td>${r.descripcion||""}</td><td>${Number(r.stock||0)}</td><td>$${Number(r.precio||0).toFixed(2)}</td><td><button class="adj">Ajustar</button></td></tr>`).join(""); document.querySelectorAll(".adj").forEach((btn,idx)=>btn.onclick=()=>location.href=adjustUrl(rows[idx]));}
async function load(){ try{ MENU=await fetchJSON("menu.json"); render(); }catch(err){ console.error(err); }} document.getElementById("search").addEventListener("input", render); document.getElementById("reload").onclick=load; load();
</script></body></html>
